name: Upload Files to Azure Blob Storage

on:
  push:
    branches:
      - main  # Triggers the upload whenever you push code to the main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Download the repository files onto the runner
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Upload the chosen directory to Azure Blob Storage
    - name: Upload to Azure Blob
      uses: bacongobbler/azure-blob-storage-upload@main
      with:
        source_dir: 'my-local-folder' # Replace with the folder name in your repo you want to upload
        container_name: 'my-azure-container' # Replace with your target Azure Blob container name
        connection_string: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
        overwrite: 'true' # Set to false if you do not want to overwrite existing files
