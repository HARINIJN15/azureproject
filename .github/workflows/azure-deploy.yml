name: Azure CI Deployment via OIDC

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write # Required for requesting the JWT via OIDC
  contents: read  # Required for actions/checkout

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Authenticate to Azure using OIDC
      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Step 3: Run your deployment tools (Example: Azure CLI)
      - name: Deploy Resources
        uses: azure/cli@v2
        with:
          inlineScript: |
            az account show
            # Add your specialized deployment commands here (e.g., az deployment group create)
